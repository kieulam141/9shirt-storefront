name: Deploy 9Shirt to Vercel

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - preview

concurrency:
  group: vercel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Pull Vercel project settings
        run: |
          if [ "${{ inputs.target }}" = "production" ]; then
            pnpm dlx vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"
          else
            pnpm dlx vercel@latest pull --yes --environment=preview --token "$VERCEL_TOKEN"
          fi

      - name: Build with Vercel
        run: |
          if [ "${{ inputs.target }}" = "production" ]; then
            pnpm dlx vercel@latest build --prod --token "$VERCEL_TOKEN"
          else
            pnpm dlx vercel@latest build --token "$VERCEL_TOKEN"
          fi

      - name: Deploy to Vercel
        run: |
          if [ "${{ inputs.target }}" = "production" ]; then
            pnpm dlx vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN"
          else
            pnpm dlx vercel@latest deploy --prebuilt --token "$VERCEL_TOKEN"
          fi
